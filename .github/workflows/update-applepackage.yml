name: Update ApplePackage

on:
  schedule:
    # Every Monday at 10:18 Asia/Shanghai (02:18 UTC).
    - cron: "18 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-applepackage
  cancel-in-progress: true

jobs:
  update:
    name: Resolve and verify ApplePackage
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: Pastel.xcodeproj
      SCHEME: Pastel
      RESOLVED_FILE: Pastel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$({ find /Applications -maxdepth 1 -type d -name 'Xcode*.app' ! -iname '*beta*' -print || true; } | sort -V | tail -n 1)"
          if [[ -z "$xcode_path" ]]; then
            echo "No stable Xcode installation was found." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Resolve the newest compatible ApplePackage
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          cp "$RESOLVED_FILE" "$RUNNER_TEMP/Package.resolved.before"
          old_version="$(python3 - "$RESOLVED_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              data = json.load(file)
          pin = next(pin for pin in data["pins"] if pin["identity"].lower() == "applepackage")
          print(pin["state"]["version"])
          PY
          )"

          python3 - "$RESOLVED_FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as file:
              data = json.load(file)
          data["pins"] = [
              pin for pin in data["pins"]
              if pin["identity"].lower() != "applepackage"
          ]
          with open(path, "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2, ensure_ascii=False)
              file.write("\n")
          PY

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

          new_version="$(python3 - "$RESOLVED_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              data = json.load(file)
          pin = next(pin for pin in data["pins"] if pin["identity"].lower() == "applepackage")
          print(pin["state"]["version"])
          PY
          )"

          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

          if [[ "$old_version" == "$new_version" ]]; then
            cp "$RUNNER_TEMP/Package.resolved.before" "$RESOLVED_FILE"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "ApplePackage is already current at $old_version."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "ApplePackage update found: $old_version -> $new_version"
          fi

      - name: Build without code signing
        if: steps.resolve.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Open or refresh update pull request
        if: steps.resolve.outputs.updated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OLD_VERSION: ${{ steps.resolve.outputs.old_version }}
          NEW_VERSION: ${{ steps.resolve.outputs.new_version }}
        run: |
          set -euo pipefail

          branch="automation/applepackage-$NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add "$RESOLVED_FILE"
          git commit -m "Update ApplePackage to $NEW_VERSION"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --title "Update ApplePackage to $NEW_VERSION" \
              --body "Automated update from ApplePackage $OLD_VERSION to $NEW_VERSION. The macOS app builds successfully with code signing disabled."
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "Update ApplePackage to $NEW_VERSION" \
              --body "Automated update from ApplePackage $OLD_VERSION to $NEW_VERSION. The macOS app builds successfully with code signing disabled."
          fi
